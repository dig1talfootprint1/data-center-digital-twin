services:
  postgres:
    image: postgres:18
    container_name: data-center-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

      - ./database/schema/01_data_centers.sql:/docker-entrypoint-initdb.d/01_data_centers.sql:ro
      - ./database/schema/02_rooms.sql:/docker-entrypoint-initdb.d/02_rooms.sql:ro
      - ./database/schema/03_racks.sql:/docker-entrypoint-initdb.d/03_racks.sql:ro
      - ./database/schema/04_servers.sql:/docker-entrypoint-initdb.d/04_servers.sql:ro
      - ./database/schema/05_server_telemetry.sql:/docker-entrypoint-initdb.d/05_server_telemetry.sql:ro
      - ./database/schema/06_alerts.sql:/docker-entrypoint-initdb.d/06_alerts.sql:ro

      - ./database/seed/01_initial_infrastructure.sql:/docker-entrypoint-initdb.d/07_initial_infrastructure.sql:ro

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile

    container_name: data-center-simulator

    restart: unless-stopped

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      - postgres

  api:
    build:
      context: ./api

    container_name: data-center-api

    restart: unless-stopped

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "3000:3000"

    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend

    container_name: data-center-frontend

    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - api

volumes:
  postgres_data: